[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-dj"
version = "0.1.0"
description = "Local audio-analysis foundation for a general-purpose DJ system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.10.2",
    "numpy>=1.26",
    "scikit-learn>=1.6",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
playback = ["sounddevice>=0.5"]
vocals = ["demucs==4.1.0"]
cloud = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_dj"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
